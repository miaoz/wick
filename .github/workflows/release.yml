name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build universal macOS app
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          preferred="/Applications/Xcode_26.6.app"
          if [[ -d "$preferred" ]]; then
            sudo xcode-select -s "$preferred"
          else
            latest="$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -z "${latest}" ]]; then
              echo "No Xcode 26.x found under /Applications" >&2
              ls /Applications/Xcode*.app 2>/dev/null || true
              exit 1
            fi
            echo "Xcode 26.6 not found; using ${latest}"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION} BUILD=${GITHUB_RUN_NUMBER}"

      - name: Build iOS app (generic device scheme)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WickPhone.xcodeproj \
            -scheme WickPhone \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            build CODE_SIGNING_ALLOWED=NO

      - name: iOS Store regression tests (simulator)
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin).get("devices",{}); sys.stdout.write(next((dev["udid"] for runtime in d.values() for dev in runtime if dev.get("isAvailable") and "iPhone" in dev.get("name","")), ""))')"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator; skipping iOS Store regression tests."
            exit 0
          fi
          echo "Using simulator: ${DEVICE_ID}"
          xcodebuild test \
            -project ios/WickPhone.xcodeproj \
            -scheme WickPhone \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS SwiftPM targets (fast shared-target gate)
        run: |
          set -euo pipefail
          IPHONE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --target WickCalendarKit --triple arm64-apple-ios16.0 --sdk "$IPHONE_SDK"

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./scripts/package_zip.sh

      - name: Verify binary + signature + Universal arch
        run: |
          set -euo pipefail
          APP="dist/Wick.app/Contents/MacOS/Wick"
          test -x "$APP"
          lipo -info "$APP"
          codesign --verify --deep --strict --verbose=2 dist/Wick.app
          plutil -p dist/Wick.app/Contents/Info.plist
          test -s dist/Wick-macOS-*.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: Wick-macOS-${{ steps.version.outputs.version }}
          path: dist/Wick-macOS-*.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux app & packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc g++ \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            libssl-dev libsecret-1-dev pkg-config libgl1-mesa-dev zip

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION} BUILD=${GITHUB_RUN_NUMBER}"

      - name: Package generic Linux tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./scripts/package_linux.sh

      - name: Build Arch Linux package (Docker)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel cmake ninja gcc qt6-base qt6-declarative qt6-svg openssl libsecret pkgconf git
            useradd -m builduser
            chown -R builduser:builduser /workspace
            su builduser -c '
              mkdir -p dist/stage-arch
              cp linux/packaging/PKGBUILD dist/stage-arch/
              cp linux/packaging/wick.service dist/stage-arch/
              sed -i -E \"s/^pkgver=.*/pkgver=${VERSION}/\" dist/stage-arch/PKGBUILD
              cd dist/stage-arch && makepkg -f --nodeps
              cp *.pkg.tar.zst ../
            '
          "

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Wick-Linux-${{ steps.version.outputs.version }}
          path: |
            dist/Wick-Linux-*.tar.gz
            dist/Wick-Linux-*.zip
            dist/wick-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release & Upload R2
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist-artifacts

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          find dist-artifacts -type f -exec mv {} dist/ \;
          ls -lh dist/

      - name: Generate release body
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## Wick ${VERSION}"
            echo
            if [[ -n "${PREV}" ]]; then
              echo "本版改动（自 ${PREV}）："
              echo
              git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" \
                | grep -v '^- Bump version' || true
              echo
            else
              echo "最近改动："
              echo
              git log --no-merges -30 --pretty=format:'- %s' \
                | grep -v '^- Bump version' || true
              echo
            fi
            echo
            echo "### 安装说明"
            echo
            echo "#### macOS"
            echo "下载 \`Wick-macOS-${VERSION}.zip\`，解压后把 \`Wick.app\` 拖入「应用程序」。首次打开若被 Gatekeeper 拦截，请在 Finder 中右键 → 打开，或在「系统设置 → 隐私与安全性」中允许。"
            echo
            echo "> macOS 发布包使用 ad-hoc 签名，尚未提交 Apple Developer ID 公证。"
            echo
            echo "#### Linux (Arch / Omarchy)"
            echo "下载 \`wick-${VERSION}-1-x86_64.pkg.tar.zst\` 后安装："
            echo "\`\`\`bash"
            echo "sudo pacman -U wick-${VERSION}-1-x86_64.pkg.tar.zst"
            echo "\`\`\`"
            echo
            echo "#### Linux (通用独立安装包)"
            echo "下载 \`Wick-Linux-${VERSION}.tar.gz\` 后解压运行："
            echo "\`\`\`bash"
            echo "tar -xzf Wick-Linux-${VERSION}.tar.gz"
            echo "cd Wick-Linux-${VERSION} && ./install.sh"
            echo "\`\`\`"
          } > dist/release-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Wick-macOS-*.zip
            dist/Wick-Linux-*.tar.gz
            dist/Wick-Linux-*.zip
            dist/wick-*.pkg.tar.zst
          body_path: dist/release-body.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          echo "Uploading artifacts to Cloudflare R2 (application-releases/wick)..."
          if [[ -f "dist/Wick-macOS-${VERSION}.zip" ]]; then
            npx wrangler r2 object put "application-releases/wick/Wick-macOS-${VERSION}.zip" --file="dist/Wick-macOS-${VERSION}.zip" --remote
            npx wrangler r2 object put "application-releases/wick/Wick.zip" --file="dist/Wick-macOS-${VERSION}.zip" --remote
          fi
          if [[ -f "dist/Wick-Linux-${VERSION}.tar.gz" ]]; then
            npx wrangler r2 object put "application-releases/wick/Wick-Linux-${VERSION}.tar.gz" --file="dist/Wick-Linux-${VERSION}.tar.gz" --remote
            npx wrangler r2 object put "application-releases/wick/Wick-Linux.tar.gz" --file="dist/Wick-Linux-${VERSION}.tar.gz" --remote
          fi

      - name: Prune old releases (keep latest 10)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep=10
          count=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            count=$((count + 1))
            if [ "$count" -gt "$keep" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
