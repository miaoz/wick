name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS app
    # Prefer the same major toolchain as local development (macOS 26 / Xcode 26.x).
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release-body step lists commits since the previous tag, so the
          # shallow default (single tag commit, no tags) will not do.
          fetch-depth: 0

      # Match local Xcode when available (this machine: 26.6 / 17F113).
      # Falls back to the newest installed 26.x if 26.6 is missing on a future image.
      - name: Select Xcode
        run: |
          set -euo pipefail
          preferred="/Applications/Xcode_26.6.app"
          if [[ -d "$preferred" ]]; then
            sudo xcode-select -s "$preferred"
          else
            latest="$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -z "${latest}" ]]; then
              echo "No Xcode 26.x found under /Applications" >&2
              ls /Applications/Xcode*.app 2>/dev/null || true
              exit 1
            fi
            echo "Xcode 26.6 not found; using ${latest}"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          # Fail early with a clear message if Swift is older than Package.swift requires.
          swift package describe >/dev/null

      - name: Unit tests
        run: swift test

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION} BUILD=${GITHUB_RUN_NUMBER}"

      - name: Build iOS app (generic device scheme)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/WickPhone.xcodeproj \
            -scheme WickPhone \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build iOS SwiftPM targets (fast shared-target gate)
        run: |
          set -euo pipefail
          IPHONE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --target WickCalendarKit --triple arm64-apple-ios16.0 --sdk "$IPHONE_SDK"

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./scripts/package_zip.sh

      - name: Verify binary + signature + Universal arch
        run: |
          set -euo pipefail
          APP="dist/Wick.app/Contents/MacOS/Wick"
          test -x "$APP"
          lipo -info "$APP"
          codesign --verify --deep --strict --verbose=2 dist/Wick.app
          plutil -p dist/Wick.app/Contents/Info.plist
          # The zip was already unzipped and re-verified by package_zip.sh;
          # confirm the artifact exists and is non-trivial.
          test -s dist/Wick-macOS-*.zip
          ls -lh dist/*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Wick-macOS-${{ steps.version.outputs.version }}
          path: dist/Wick-macOS-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Generate release body
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          mkdir -p dist
          {
            echo "## Wick ${VERSION}"
            echo
            if [[ -n "${PREV}" ]]; then
              echo "本版改动（自 ${PREV}）："
              echo
              git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" \
                | grep -v '^- Bump version' || true
              echo
            else
              echo "最近改动："
              echo
              git log --no-merges -30 --pretty=format:'- %s' \
                | grep -v '^- Bump version' || true
              echo
            fi
            echo
            echo "### 安装"
            echo
            echo "下载 \`Wick-macOS-${VERSION}.zip\`，解压后把 \`Wick.app\` 拖入「应用程序」。首次打开若被 Gatekeeper 拦截，请在 Finder 中右键 → 打开，或在「系统设置 → 隐私与安全性」中允许。"
            echo
            echo "> 发布包使用 ad-hoc 签名，**尚未**使用 Apple Developer ID 签名或公证。"
          } > dist/release-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Wick-macOS-*.zip
          body_path: dist/release-body.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_FILE="dist/Wick-macOS-${VERSION}.zip"
          echo "Uploading ${ZIP_FILE} to Cloudflare R2 (application-releases/wick)..."
          npx wrangler r2 object put "application-releases/wick/Wick-macOS-${VERSION}.zip" --file="${ZIP_FILE}" --remote
          npx wrangler r2 object put "application-releases/wick/Wick.zip" --file="${ZIP_FILE}" --remote

      # Keep only the 10 newest releases; older ones are deleted (git tags stay,
      # so any old version can still be checked out and rebuilt if needed).
      - name: Prune old releases (keep latest 10)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keep=10
          count=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            count=$((count + 1))
            if [ "$count" -gt "$keep" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
