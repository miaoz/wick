name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          # Fail early with a clear message if Swift is older than Package.swift requires.
          swift package describe >/dev/null

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION} BUILD=${GITHUB_RUN_NUMBER}"

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: ./scripts/package_zip.sh

      - name: Verify binary
        run: |
          APP="dist/Wick.app/Contents/MacOS/Wick"
          test -x "$APP"
          lipo -info "$APP"
          plutil -p dist/Wick.app/Contents/Info.plist
          ls -lh dist/*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wick-macOS-${{ steps.version.outputs.version }}
          path: dist/Wick-macOS-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Wick-macOS-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
